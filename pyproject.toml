[project]
name = "userharbor-sqlalchemy"
version = "0.1.0"
description = "SQLAlchemy integration for UserHarbor, a framework agnostic user management system for Python applications."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "SpaceShaman", email = "spaceshaman@tuta.io" }]
dependencies = [
  "sqlalchemy>=2.0.51",
  "userharbor>=0.1.0",
]

[project.urls]
Documentation = "https://github.com/userharbor/userharbor-sqlalchemy"
Homepage = "https://github.com/userharbor/userharbor-sqlalchemy"
Repository = "https://github.com/userharbor/userharbor-sqlalchemy"

[dependency-groups]
dev = [
  "pytest>=9.1.0",
  "pytest-cov>=7.1.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
